<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker O.S. - Login</title>
    <link rel="stylesheet" href="style.css">
</head>


<body class="body-login">

    <main class="container-login">
        <div class="cabecalho-login">
            <h1>Joker O.S.</h1>
            <p>Acesse o sistema realizando seu Login</p>
        </div>

        <form action ="index.html">
            <div class="campo-grupo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="campo-grupo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="********" required>
            </div>

            <button type="submit" class="btn-primario btn-bloco">Entrar no Sistema</button>
        </form>

        <div class="rodape-card-login">
            <p>Novo por aqui? <a href="cadastro-usuario.html">Cadastrar novo colaborador</a></p>
        </div>
    </main>
    
</body>
</html>
