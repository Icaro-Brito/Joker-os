<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joker O.S. - Cadastro de Usuário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="body-login">

  <main class="container-login">
    <div class="cabecalho-login">
      <h1>Joker O.S.</h1>
      <p>Novo Colaborador</p>
    </div>

    <form action="login.html">
      <div class="campo-grupo">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Ex: Ícaro Silva" required>
      </div>

      <div class="campo-grupo">
        <label for="email-cad">E-mail</label>
        <input type="email" id="email-cad" placeholder="seu@email.com" required>
      </div>

      <div class="campo-grupo">
        <label for="senha-cad">Senha</label>
        <input type="password" id="senha-cad" placeholder="••••••••" required>
      </div>

      <div class="campo-grupo">
        <label for="perfil">Perfil de Acesso</label>
        <select id="perfil" required>
          <option value="" disabled selected>Selecione o perfil...</option>
          <option value="tecnico">Técnico de Bancada</option>
          <option value="adm">Administrador (ADM)</option>
          <option value="adm-tecnico">ADM / Técnico (Acesso Total)</option>
        </select>
      </div>

      <button type="submit" class="btn-primario btn-bloco">Cadastrar Colaborador</button>
    </form>

    <div class="rodape-card-login">
      <p>Já possui conta? <a href="login.html">Voltar para o Login</a></p>
    </div>
  </main>

</body>
</html>
